events {}
http {
  server {
    listen 8080;
    server_name localhost;

    # Local nginx mapping: maps /my-next-learning/ to the repo's out/ directory
    location /my-next-learning/ {
      alias /path/to/repo/out/;
      index index.html;
      try_files $uri $uri/ =404;
    }

    # Optional: serve favicon if requested at root
    location = /favicon.ico {
      alias /path/to/repo/out/favicon.ico;
    }
  }
}
