worker_processes  1;
error_log  ./logs/error.log warn;
pid       ./logs/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /opt/homebrew/etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;

  server {
    listen 8081;
    server_name localhost;

    # Map the repo basePath to the exported out/ directory (relative to -p prefix)
    location /my-next-learning/ {
      alias ../../out/;
      index index.html;
      try_files $uri $uri/ =404;
    }

    # Serve favicon if requested at root
    location = /favicon.ico {
      alias ../../out/favicon.ico;
    }
  }
}
